<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompteur</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #fff;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 1800px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 25px;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #ddd;
            resize: vertical;
            transition: border 0.3s;
        }

        textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        .controls {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .speed-controls {
            background: #e9f5ff;
            padding: 10px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
        }

        .controls label {
            margin-right: 8px;
            font-weight: 500;
            color: #555;
        }

        .controls input[type="color"] {
            width: 40px;
            height: 40px;
            padding: 2px;
            cursor: pointer;
        }

        .controls input[type="number"],
        .controls select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        button:hover {
            background-color: #0069d9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .speed-slider {
            width: 200px;
            margin: 0 15px;
        }

        .prompter-container {
            width: 100%;
            height: 400px;
            border: 2px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s;
        }

        #prompter {
            position: absolute;
            text-align: center;
            width: 90%;
            transform: translateY(0);
            padding: 50px 0;
            line-height: 2.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            border: none;
        }

        .fullscreen .controls {
            background-color: rgba(0, 0, 0, 0.85);
            padding: 15px;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1001;
            border-bottom: 1px solid #333;
        }

        .fullscreen .prompter-container {
            width: 100%;
            height: calc(100% - 80px);
            border: none;
            border-radius: 0;
            margin-top: 80px;
        }

        .fullscreen #prompter {
            font-size: 3em;
            line-height: 2.5;
        }

        .speed-display {
            font-weight: bold;
            min-width: 100px;
            display: inline-block;
            color: #0069d9;
            text-align: center;
            font-size: 16px;
        }

        .fullscreen .speed-display {
            color: #4dabf7;
        }

        .speed-value {
            font-size: 1.2em;
            font-weight: bold;
        }

        .ultra-fast {
            background-color: #ff6b6b;
            color: white;
        }

        .ultra-fast:hover {
            background-color: #fa5252;
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                padding: 15px;
            }
            
            .controls {
                gap: 8px;
            }
            
            button {
                padding: 8px 15px;
                font-size: 14px;
            }
            
            .controls input[type="number"],
            .controls select {
                padding: 6px 10px;
                font-size: 14px;
            }
            
            .speed-slider {
                width: 120px;
                margin: 0 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prompteur</h1>
        <textarea id="textInput" placeholder="Entrez votre texte ici... Vous pouvez utiliser des balises HTML pour la mise en forme (ex: &lt;front color='red'&gt;texte rouge&lt;/front&gt;)"></textarea>
        <div class="controls">
            <div class="control-group">
                <button id="startStop">Démarrer</button>
                <button id="reset">Réinitialiser</button>
                <button id="fullscreen">Plein écran</button>
            </div>
            
            <div class="control-group speed-controls">
                <button id="decreaseSpeed">-</button>
                <input type="range" id="speedSlider" class="speed-slider" min="0.1" max="100" step="0.1" value="50">
                <button id="increaseSpeed">+</button>
                <div class="speed-display">
                    Vitesse: <span class="speed-value" id="speedValue">50</span> ms
                </div>
                <button id="ultraFast" class="ultra-fast">Turbo (0.1ms)</button>
            </div>
            
            <div class="control-group">
                <label for="color">Couleur:</label>
                <input type="color" id="color" value="#ffffff">
            </div>
            <div class="control-group">
                <label for="bgColor">Fond:</label>
                <input type="color" id="bgColor" value="#000000">
            </div>
            <div class="control-group">
                <label for="fontSize">Taille:</label>
                <input type="number" id="fontSize" value="24" min="10" max="72">
            </div>
            <div class="control-group">
                <label for="fontFamily">Police:</label>
                <select id="fontFamily">
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="Times New Roman, serif">Times New Roman</option>
                    <option value="Courier New, monospace">Courier New</option>
                    <option value="Verdana, sans-serif">Verdana</option>
                    <option value="Georgia, serif">Georgia</option>
                </select>
            </div>
            <div class="control-group">
                <label for="lineHeight">Interligne:</label>
                <input type="number" id="lineHeight" value="2.5" min="1" max="5" step="0.1">
            </div>
            <div class="control-group">
                <button id="alignLeft">Gauche</button>
                <button id="alignCenter">Centre</button>
                <button id="alignRight">Droite</button>
            </div>
        </div>
        <div class="prompter-container">
            <div id="prompter"></div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Elements
            const elements = {
                textInput: document.getElementById("textInput"),
                startStopButton: document.getElementById("startStop"),
                resetButton: document.getElementById("reset"),
                fullscreenButton: document.getElementById("fullscreen"),
                increaseSpeedButton: document.getElementById("increaseSpeed"),
                decreaseSpeedButton: document.getElementById("decreaseSpeed"),
                speedSlider: document.getElementById("speedSlider"),
                ultraFastButton: document.getElementById("ultraFast"),
                colorInput: document.getElementById("color"),
                bgColorInput: document.getElementById("bgColor"),
                fontSizeInput: document.getElementById("fontSize"),
                fontFamilyInput: document.getElementById("fontFamily"),
                lineHeightInput: document.getElementById("lineHeight"),
                alignLeftButton: document.getElementById("alignLeft"),
                alignCenterButton: document.getElementById("alignCenter"),
                alignRightButton: document.getElementById("alignRight"),
                prompter: document.getElementById("prompter"),
                prompterContainer: document.querySelector(".prompter-container"),
                speedValue: document.getElementById("speedValue")
            };

            // État de l'application
            const state = {
                intervalId: null,
                isRunning: false,
                position: 0,
                speed: parseFloat(elements.speedSlider.value),
                savedText: "",
                minSpeed: 0.1,    // 0.1ms = RAPIDE
                maxSpeed: 100,   // 100ms = LENT
                turboMode: false
            };

            // Mise à jour de l'affichage de la vitesse
            function updateSpeedDisplay() {
                elements.speedValue.textContent = state.speed.toFixed(1);
            }

            // Fonction pour calculer le pas de modification de vitesse
            function getSpeedStep() {
                if (state.speed <= 1) return 0.1;
                if (state.speed <= 5) return 0.5;
                if (state.speed <= 20) return 1;
                return 5;
            }

            // Fonctions principales
            function startPrompt() {
                if (!state.isRunning) {
                    state.savedText = elements.textInput.value;
                    
                    // Convertit les sauts de ligne et conserve le HTML
                    elements.prompter.innerHTML = state.savedText
                        .replace(/\n/g, '<br>')
                        .replace(/  /g, ' &nbsp;');
                    
                    // Dernier temps pour le calcul du delta
                    let lastTime = performance.now();
                    let accumulatedTime = 0;
                    
                    function scrollText(currentTime) {
                        if (!state.isRunning) return;
                        
                        const deltaTime = currentTime - lastTime;
                        lastTime = currentTime;
                        accumulatedTime += deltaTime;
                        
                        // Nombre de frames à sauter pour les très hautes vitesses
                        const framesToSkip = Math.floor(accumulatedTime / state.speed);
                        
                        if (framesToSkip > 0) {
                            state.position += framesToSkip;
                            elements.prompter.style.transform = `translateY(-${state.position}px)`;
                            accumulatedTime = 0;
                            
                            // Arrêt automatique en fin de texte
                            if (state.position > elements.prompter.scrollHeight - elements.prompterContainer.clientHeight + 100) {
                                stopPrompt();
                                return;
                            }
                        }
                        
                        state.intervalId = requestAnimationFrame(scrollText);
                    }
                    
                    state.isRunning = true;
                    elements.startStopButton.textContent = "Arrêter";
                    state.intervalId = requestAnimationFrame(scrollText);
                } else {
                    stopPrompt();
                }
            }

            function stopPrompt() {
                if (state.intervalId) {
                    cancelAnimationFrame(state.intervalId);
                }
                state.isRunning = false;
                elements.startStopButton.textContent = "Démarrer";
            }

            function resetPrompt() {
                stopPrompt();
                state.position = 0;
                elements.prompter.style.transform = `translateY(0)`;
                if (state.savedText) {
                    elements.prompter.innerHTML = state.savedText.replace(/\n/g, '<br>').replace(/  /g, ' &nbsp;');
                }
            }

            // Fonctions de mise à jour
            function updateColor() {
                elements.prompter.style.color = elements.colorInput.value;
            }

            function updateBgColor() {
                elements.prompterContainer.style.backgroundColor = elements.bgColorInput.value;
            }

            function updateFontSize() {
                elements.prompter.style.fontSize = `${elements.fontSizeInput.value}px`;
            }

            function updateFontFamily() {
                elements.prompter.style.fontFamily = elements.fontFamilyInput.value;
            }

            function updateLineHeight() {
                elements.prompter.style.lineHeight = elements.lineHeightInput.value;
            }

            function updateTextAlignment(alignment) {
                elements.prompter.style.textAlign = alignment;
            }

            // Fonctions de contrôle
            function toggleFullscreen() {
                if (!document.fullscreenElement) {
                    elements.prompterContainer.requestFullscreen().catch(err => {
                        console.error("Erreur plein écran:", err);
                    });
                } else {
                    document.exitFullscreen();
                }
            }

            function setSpeed(newSpeed) {
                state.speed = Math.max(state.minSpeed, Math.min(state.maxSpeed, newSpeed));
                elements.speedSlider.value = state.speed;
                updateSpeedDisplay();
            }

            // INVERSE: Le bouton + augmente la vitesse (diminue le délai)
            function increaseSpeed() {
                setSpeed(state.speed - getSpeedStep());
            }

            // INVERSE: Le bouton - diminue la vitesse (augmente le délai)
            function decreaseSpeed() {
                setSpeed(state.speed + getSpeedStep());
            }

            function toggleTurboMode() {
                state.turboMode = !state.turboMode;
                if (state.turboMode) {
                    setSpeed(0.1); // Vitesse maximale (délai minimal)
                    elements.ultraFastButton.textContent = "Normal (100ms)";
                    elements.ultraFastButton.style.backgroundColor = "#4dabf7";
                } else {
                    setSpeed(100); // Vitesse minimale (délai maximal)
                    elements.ultraFastButton.textContent = "Turbo (0.1ms)";
                    elements.ultraFastButton.style.backgroundColor = "#ff6b6b";
                }
            }

            function moveText(amount) {
                state.position = Math.max(0, Math.min(
                    elements.prompter.scrollHeight - elements.prompterContainer.clientHeight, 
                    state.position + amount
                ));
                elements.prompter.style.transform = `translateY(-${state.position}px)`;
            }

            // Événements
            elements.startStopButton.addEventListener("click", startPrompt);
            elements.resetButton.addEventListener("click", resetPrompt);
            elements.colorInput.addEventListener("input", updateColor);
            elements.bgColorInput.addEventListener("input", updateBgColor);
            elements.fontSizeInput.addEventListener("input", updateFontSize);
            elements.fontFamilyInput.addEventListener("change", updateFontFamily);
            elements.lineHeightInput.addEventListener("input", updateLineHeight);
            elements.alignLeftButton.addEventListener("click", () => updateTextAlignment("left"));
            elements.alignCenterButton.addEventListener("click", () => updateTextAlignment("center"));
            elements.alignRightButton.addEventListener("click", () => updateTextAlignment("right"));
            elements.fullscreenButton.addEventListener("click", toggleFullscreen);
            elements.increaseSpeedButton.addEventListener("click", increaseSpeed);
            elements.decreaseSpeedButton.addEventListener("click", decreaseSpeed);
            elements.speedSlider.addEventListener("input", (e) => setSpeed(parseFloat(e.target.value)));
            elements.ultraFastButton.addEventListener("click", toggleTurboMode);

            // Plein écran
            document.addEventListener("fullscreenchange", () => {
                if (document.fullscreenElement) {
                    elements.prompterContainer.classList.add("fullscreen");
                } else {
                    elements.prompterContainer.classList.remove("fullscreen");
                }
            });

            // Raccourcis clavier
            document.addEventListener("keydown", (event) => {
                if (event.target === elements.textInput) return;
                
                switch (event.key) {
                    case " ":
                        event.preventDefault();
                        startPrompt();
                        break;
                    case "ArrowRight":  // Flèche droite = plus rapide (diminue le délai)
						increaseSpeed();
						break;
					case "ArrowLeft":   // Flèche gauche = plus lent (augmente le délai)
						decreaseSpeed();
						break;
                    case "Enter":
                        resetPrompt();
                        break;
                    case "ArrowUp":
                        moveText(-100);
                        break;
                    case "ArrowDown":
                        moveText(100);
                        break;
                    case "Escape":
                        if (document.fullscreenElement) {
                            document.exitFullscreen();
                        }
                        break;
                    case "t":
                    case "T":
                        toggleTurboMode();
                        break;
                }
            });

            // Initialisation
            updateColor();
            updateBgColor();
            updateFontSize();
            updateFontFamily();
            updateLineHeight();
            updateTextAlignment("center");
            updateSpeedDisplay();
        });
    </script>
</body>
</html>
